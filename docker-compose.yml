version: '3.8'

services:
  # 1. Frontend Web Gateway & Static Asset Server (Nginx + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_frontend
    ports:
      - "8080:80"
    networks:
      - lms_network
    depends_on:
      - backend

  # 2. Backend Laravel PHP 8.2-FPM Service
  backend:
    build:
      context: ./task_tutorials_backend
      dockerfile: Dockerfile
    container_name: lms_backend
    environment:
      APP_NAME: "TaskTutor Production"
      APP_ENV: production
      APP_KEY: "base64:3S3Yd29x9d6Vd0uWv5xQ3q+t/7rW8m3pQ1z2x3c4v5b="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_DATABASE: laravel_production
      DB_USERNAME: lms_user
      DB_PASSWORD: SecureLmsPassword123!
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
    networks:
      - lms_network
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_started

  # 3. MySQL 8.0 Relational Database (Internal to network, no host port exposed for security!)
  mysql_db:
    image: mysql:8.0
    container_name: lms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePassword123!
      MYSQL_DATABASE: laravel_production
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: SecureLmsPassword123!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecurePassword123!"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 4. Redis In-Memory Cache & Session Store
  redis_cache:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
