version: '3.8'

services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: task_tutor_db
    restart: always
    environment:
      MYSQL_DATABASE: task_tutor
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service
  redis:
    image: redis:alpine
    container_name: task_tutor_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Laravel Backend PHP-FPM Service
  backend:
    build:
      context: ./task_tutorials_backend
      dockerfile: Dockerfile
    container_name: task_tutor_backend
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: task_tutor
      DB_USERNAME: taskuser
      DB_PASSWORD: taskpassword
      REDIS_HOST: redis
    volumes:
      - ./task_tutorials_backend:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Nginx Reverse Proxy + React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_tutor_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
