---
# roles/common/tasks/main.yml
- name: Update apt cache and install base system utilities
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
    name:
      - curl
      - git
      - unzip
      - htop
      - iotop
      - net-tools
      - ufw
      - chrony
      - software-properties-common
    state: present

- name: Apply High-Concurrency Linux Kernel Sysctl Tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_set: yes
  loop:
    - { key: "net.core.somaxconn", value: "65535" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "65535" }
    - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
    - { key: "net.ipv4.ip_local_port_range", value: "1024 65535" }
    - { key: "fs.file-max", value: "2097152" }

- name: Set system security ulimits for www-data and ubuntu users
  ansible.builtin.pam_limits:
    domain: "{{ item }}"
    limit_type: "{{ item_type }}"
    limit_item: nofile
    value: "65535"
  loop:
    - "www-data"
    - "ubuntu"
  loop_control:
    loop_var: item
  vars:
    item_type: "both"

- name: Ensure app deployment directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0775"
