---
# roles/php_fpm/tasks/main.yml
- name: Add Ondrej Sury PHP PPA repository
  ansible.builtin.apt_repository:
    repo: "ppa:ondrej/php"
    state: present

- name: Install PHP 8.2 and required production extensions
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-redis"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-opcache"
      - "php{{ php_version }}-bcmath"
    state: present

- name: Deploy tuned PHP-FPM www.conf pool configuration
  ansible.builtin.template:
    src: www.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart PHP-FPM

- name: Deploy tuned OPcache php.ini configuration
  ansible.builtin.template:
    src: opcache.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/10-opcache.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart PHP-FPM
