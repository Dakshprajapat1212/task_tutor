# Production Nginx Server Configuration for Task Tutorials LMS
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    server_tokens off;

    # Rate Limiting Zones (Leaky Bucket)
    limit_req_zone $binary_remote_addr zone=general_api:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # FastCGI Cache Configuration (Optional Micro-caching for 20k reads)
    fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=API_CACHE:50m max_size=250m inactive=10m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;

    server {
        listen 80;
        server_name api.tasktutorials.com;
        root /var/www/task_tutorials_backend/public;
        index index.php;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Standard API routes
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Protected Auth Routes with Strict Rate Limiting
        location ~* ^/api/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # FastCGI Execution Block for PHP-FPM
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            
            # Use Unix Domain Socket for zero-TCP overhead
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # FastCGI Buffering Tuning (Shields PHP workers from slow clients)
            fastcgi_buffering on;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_read_timeout 60s;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 10s;
        }

        # Deny hidden files (.env, .git)
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
