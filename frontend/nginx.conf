server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for high-speed delivery
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. API & Sanctum Endpoints -> Routed to Laravel PHP-FPM container
    location ~ ^/(api|sanctum) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        
        # Buffer tuning for high throughput
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60s;
    }

    # 2. Cache static assets aggressively (Immutable Cache Strategy)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Never cache index.html so updates load instantly on refresh
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 4. React Single Page Application (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
