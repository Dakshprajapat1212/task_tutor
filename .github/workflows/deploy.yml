name: TaskTutor Production CI Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 347181052564.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test-frontend:
    name: 🧪 Verify Frontend Build (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify React Production Build
        run: |
          cd frontend
          npm run build

  test-backend:
    name: 🧪 Test Backend (Laravel PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, gd

      - name: Install Composer Dependencies
        run: |
          cd task_tutorials_backend
          composer install --no-interaction --prefer-dist

      - name: Run PHPUnit Tests
        env:
          APP_KEY: base64:u/sBq1J0v3zG9Xm2Y4L6k8P0Q2w4E6R8T0Y2U4I6O8P=
        run: |
          cd task_tutorials_backend
          ./vendor/bin/phpunit

  build-and-push:
    name: 🚀 Build & Push Images to ECR (Dual-Tagged)
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image (SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/task-tutor-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/task-tutor-frontend:latest

      - name: Build & Push Backend Image (SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: ./task_tutorials_backend
          file: ./task_tutorials_backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/task-tutor-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/task-tutor-backend:latest
