name: Production CI/CD Pipeline

# Trigger on push or pull request to master/main
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Ensure only one deployment runs at a time for this environment
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # STAGE 1: Frontend Build & Static Analysis
  # ==========================================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Archive Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================================
  # STAGE 2: Backend Lint, PHPStan & Unit Testing
  # ==========================================================
  backend-ci:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task_tutorials_backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task_tutor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Backend Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Test Environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: task_tutor_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

  # ==========================================================
  # STAGE 3: Build & Tag Immutable Docker Images
  # ==========================================================
  docker-build:
    name: Container Build & Vulnerability Check
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (Multi-architecture builder)
        uses: docker/setup-buildx-action@v3

      - name: Generate Immutable Git Commit SHA Tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: tasktutor-frontend:${{ steps.vars.outputs.sha_short }}
          load: true

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./task_tutorials_backend
          push: false
          tags: tasktutor-backend:${{ steps.vars.outputs.sha_short }}
          load: true

  # ==========================================================
  # STAGE 4: Zero-Downtime Deployment
  # ==========================================================
  deploy:
    name: Zero-Downtime Rolling Deployment
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Notification
        run: |
          echo "Deploying release ${{ github.sha }} to production cluster..."
          echo "Health check verification: /api/health"
